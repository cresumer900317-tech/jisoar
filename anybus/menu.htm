function loadXMLDocASynch(url,params,onReadyStateChangeFunction,onTimeoutFunction,TimeoutMs)
{
  var xmlhttp;
  if (window.XMLHttpRequest) {         // code for IE7+, Firefox, Chrome, Opera, Safari
    xmlhttp = new XMLHttpRequest();
  }
  else {
    xmlhttp = new ActiveXObject("Microsoft.XMLHTTP"); // for IE5 & 6
  }

  if (onReadyStateChangeFunction != undefined){
    xmlhttp.onreadystatechange = onReadyStateChangeFunction;
  }
  if (onTimeoutFunction != undefined){
  	if ('ontimeout' in xmlhttp){
      xmlhttp.ontimeout = onTimeoutFunction;
    }
  }

  var full_url = url;
  if (params != null) full_url = full_url+"?"+params;

  xmlhttp.open("GET",full_url,true);

  if ('timeout' in xmlhttp){
    try {
    	var TimeoutValue = parseInt(TimeoutMs);
    	if (isNaN(TimeoutValue)){
  	  	xmlhttp.timeout = 10000;
  	  }
  	  else {
  	  	xmlhttp.timeout = TimeoutMs;
  	  }
  	}
  	catch(err){
  	  //
  	}
  }

  xmlhttp.send();
  return xmlhttp;
}

//-----------

function loadXMLDocSynch(url,params,TimeoutMs)
{
  var xmlhttp;
  if (window.XMLHttpRequest) {         // code for IE7+, Firefox, Chrome, Opera, Safari
    xmlhttp = new XMLHttpRequest();
  }
  else {
    xmlhttp = new ActiveXObject("Microsoft.XMLHTTP"); // for IE5 & 6
  }
  if (xmlhttp == null) return "400\x1D브라우저에서 HTTP 요구 생성 에러";

  xmlhttp.open("POST",url,false);

  if ('timeout' in xmlhttp){
    try {
    	var TimeoutValue = parseInt(TimeoutMs);
    	if (isNaN(TimeoutValue)){
  	  	xmlhttp.timeout = 10000;
  	  }
  	  else {
  	  	xmlhttp.timeout = TimeoutMs;
  	  }
  	}
  	catch(err){
  	  //
  	}
  }

  xmlhttp.send(params);
  return xmlhttp.responseText;
}

function SaveSegmentedSettingsCombined(url,args,act,disp_result)
{
  var CombinedArray = [];

  if (args != null){
  	var ItemCount = args.length;

  	var StdString = "save=";
    var CurrentString = "";
  	for(var i=0; i<ItemCount; i++){
  	  if ((CurrentString.length + args[i].length) < 200){
  	    if (CurrentString.length > 0) CurrentString = CurrentString + "+";
  	    CurrentString = CurrentString + args[i];
  	  }
  	  else {
  	    if (CurrentString.length > 0) {
  	      CombinedArray.push(StdString+CurrentString);
  	      CurrentString = args[i];
  	    }
  	  }
  	}
  	if (CurrentString.length > 0) CombinedArray.push(StdString+CurrentString);
  }

	if (act != null){
	  if (act.length > 0) CombinedArray.push("action="+act);
	}

	return SaveSegmentedSettings(url,CombinedArray,disp_result);
}

//-----------

function SaveSegmentedSettings(url,args,disp_result)
{
	var ItemCount = args.length;

	var LastResultText = "전송설정 에러. Http 오류.";
	var LastResultCode = 500;

	for(var i=0; i<ItemCount; i++){
	  var HttpResult = decodeURIComponent(loadXMLDocSynch(url,args[i]));

	  if (HttpResult == null){
	  	LastResultText = "네트워크의 시간초과입니다.";
	  	LastResultCode = 500;
	    break;
	  }
	  else {
      var Result_arr = [];
      Result_arr = HttpResult.split('\x1D');

      var Result_Code = 0;
      var Result_Text = "";
      for(var j=0; j<Result_arr.length; j++){
        var ItemRes_arr = [];
        ItemRes_arr = Result_arr[j].split("\x1F");
        if (ItemRes_arr.length == 2){
          var CurrentCode = parseInt(ItemRes_arr[0],10);
          if (CurrentCode > Result_Code){
            Result_Code = CurrentCode;
            Result_Text = ItemRes_arr[1];
          }
        }
      }

      if (Result_Code > 0){
	      LastResultText = Result_Text;
	      LastResultCode = Result_Code;
	    }
	    else {
	      LastResultText = "알수없는 결과";
	      LastResultCode = 500;
	    }

	    if (LastResultCode != 200) break;
	  }
	}

	if (disp_result != 0) alert(LastResultText);
  var ResultArray = {Text:LastResultText,Code:LastResultCode};
	return ResultArray;
}

function GetGlobalVar(var_name, default_value)
{
  var cookie_result = readCookie(var_name);
  if (cookie_result != null) default_value = cookie_result;
  return default_value;
}

//-----------

function GetGlobalInt(var_name, default_value)
{
  return parseInt(GetGlobalVar(var_name,default_value));
}

//-----------

function SetGlobalVar(var_name, value_to_set)
{
  createCookie(var_name,value_to_set,0);
}

//-----------

function createCookie(c_name,c_value,days)
{
  var expires = "";

	if (days != 0) {
		var date = new Date();
		date.setTime(date.getTime()+(days*24*60*60*1000));
		expires = "; expires="+date.toGMTString();
	}
	document.cookie = c_name+"="+c_value+expires+"; path=/; SameSite=Lax";
}

//-----------

function readCookie(c_name)
{
	var nameEQ = c_name + "=";
	var ca = document.cookie.split(';');
	for(var i=0;i < ca.length;i++) {
		var c = ca[i];
		while (c.charAt(0)==' ') c = c.substring(1,c.length);
		if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
	}
	return null;
}

//-----------

function eraseCookie(c_name)
{
	createCookie(c_name,"",-1);
}

function AddSelectBoxOption(ctrl_id, caption, val, selectd)
{
  var obj = document.getElementById(ctrl_id);
  if (obj != null){

    var idx = -1;
    for(var i=0; i<obj.options.length; i++){
      if (obj.options[i].value == val){
        idx = i;
        break;
      }
    }
    var NewOption = undefined;
    
    if (idx >= 0){
      NewOption = obj.options[i];
    }

    if (idx < 0){ // new item
      NewOption = document.createElement('option');
    }
    
    NewOption.text  = caption;
    NewOption.value = val;
    if (selectd != undefined){
      if (selectd != false) NewOption.selected = true;
    }
    
    if (idx < 0){ // new item
      obj.options[obj.options.length] = NewOption;
    }
  }
}

function FixTableRows(table_id)
{
  var Table = document.getElementById(table_id);
  //var rows = Table.getElementsByTagName("TR");
  var rows = Table.rows;
  
  var index = 0;
  
  for (var j = 0; j < rows.length; j++) {
    
    if (rows[j].offsetHeight > 0){

      var LeftCell   = sprintf("R%sLeft"  ,index%2);
      var CenterCell = sprintf("R%sCenter",index%2);
      var RightCell  = sprintf("R%sRight" ,index%2);
      index++;
      
      var cells = rows[j].cells;
      for (var i = 0; i < cells.length; i++) {
  
        var classValue = cells[i].className;
        if ((classValue.search("R0Left") >= 0) || (classValue.search("R1Left") >= 0)){
          classValue = classValue.replace("R0Left","");
          classValue = classValue.replace("R1Left","");
          classValue = classValue + " " + LeftCell;        
        }
        if ((classValue.search("R0Center") >= 0) || (classValue.search("R1Center") >= 0)){
          classValue = classValue.replace("R0Center","");
          classValue = classValue.replace("R1Center","");
          classValue = classValue + " " + CenterCell;        
        }
        if ((classValue.search("R0Right") >= 0) || (classValue.search("R1Right") >= 0)){
          classValue = classValue.replace("R0Right","");
          classValue = classValue.replace("R1Right","");
          classValue = classValue + " " + RightCell;        
        }
        cells[i].className = classValue;        
      }
    }
  }  
}

var xmlhttpLogin = null;

function NavigateToDefaultPage()
{
	// navigate to the start page (if we were on the login page)
  var sourceFile = window.location.pathname;
  if ((sourceFile.indexOf("403.htm") >= 0) || (sourceFile.length <= 1)){

  }
  NavigateTo(sourceFile);

function SetLoginControls(loginUser)
{
	var loginText = "로그인 모드: <b>"+loginUser+"</b>";
  
  // local page update
  SetInnerHtmlValue('login_area_text',loginText);
  SetClass('login_button_field',"login_field_hidden");

  // menu page update
  SetInnerHtmlValueGlobal('logged_in_user',loginText);

  SetClassGlobal('logout_button_field',"login_field");
  SetClassGlobal('login_button_field',"login_field_hidden");
}

//-----------

function SetLogoutControls()
{
  // menu page update
  SetInnerHtmlValueGlobal('logged_in_user',"로그인되지 않음");

  SetClassGlobal('logout_button_field',"login_field_hidden");
  SetClassGlobal('login_button_field',"login_field");
}

//-----------

function onTimeoutLogin()
{
  xmlhttpLogin.onreadystatechange = function() {}
  xmlhttpLogin.abort();
}

//-----------

function onStateChangeLogin()
{
  if (xmlhttpLogin == null) return;
  if (xmlhttpLogin.readyState != 4) return;
  if (xmlhttpLogin.status != 200) return;
  
  var response = decodeURIComponent(xmlhttpLogin.responseText);

	// parse the response into variables
	var responseParts = response.split("\x1E");
	var responseObject = responseParts[0].split("\x1F");
	var responseValue = parseInt(responseObject[0], 10);
	var responseText = responseObject[1];

	// clear the pasword field, so it has to be re-entered when loggin in again.
  SetTextValue('login_pass',""); 
	
	// if not logged in ok, return with error message
	if (responseValue != 200){
		// login failed
		alert(responseText);
	}
	else {
		// parse login result
		var loginObject = responseParts[1].split("\x1F");
		var loginUser = loginObject[0];
		var loginToken = loginObject[1];
	
	  // if login ok; set login state in UI
	  SetLoginControls(loginUser);
	  SetGlobalVar('token',loginToken);
	  SetGlobalVar('user',loginUser);
	
	  NavigateToDefaultPage();
	}

  onTimeoutLogin();
}

function LoginUser(userName, userPassword, publicSalt)
{
	var hashedPassword = HashPassword(userPassword, publicSalt);
	xmlhttpLogin = loadXMLDocASynch("data_srv.cgi","action=Login:"+userName+":"+hashedPassword, onStateChangeLogin, onTimeoutLogin);
}

//-----------

function onTimeoutVerify()
{
  xmlhttpVerify.onreadystatechange = function() {}
  xmlhttpVerify.abort();
}

//-----------

function onStateChangeVerify()
{
  if (xmlhttpVerify == null) return;
  if (xmlhttpVerify.readyState != 4) return;
  if (xmlhttpVerify.status != 200) return;
  
  var response = decodeURIComponent(xmlhttpVerify.responseText).split("\x1D");

	var validityItems = response[0].split("\x1F");
	var tokenValidity = parseInt(validityItems[0],10);
	var tokenUser     = validityItems[1];
	var navigateToDefault = (response[1] === "true");
	
	if (tokenValidity >= 0){
		// token is valid
		SetLoginControls(tokenUser);
		SetGlobalVar('user',tokenUser);
		if (navigateToDefault){
			NavigateToDefaultPage();
		}
	}
	else {
		// token is invalid
		SetGlobalVar('token',"");
	  SetGlobalVar('user',"");
		SetLogoutControls();
	}

  onTimeoutVerify();
}

//-----------

function VerifyLoginToken(navigateToDefault)
{
  var token = GetGlobalVar('token',"");
  if (token.length == 0) return;
	xmlhttpVerify = loadXMLDocASynch("data_srv.cgi","action=checkTokenValid:"+token+"&return="+navigateToDefault, onStateChangeVerify, onTimeoutVerify);		
}
